<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title %}
<title>{{ page.title }}</title>
{%- endif %}
{%- if page.description %}
<meta name="description" content="{{ page.description }}">
{%- endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<style>
/* The skeleton a standalone document page is written against: it brings its own
   <style>, so this supplies only what a bare fragment assumes and nothing that
   could collide with it. The site stylesheet is deliberately not loaded here. */
:root{color-scheme:light dark}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
{{ content }}
</body>
</html>
