# sim-mesh's own index: the geodata packs and nodesets every sim-mesh lists
# as sim-mesh-examples (testbed/indexes.py; sim-mesh's README, "Indexes").
# An entry is immutable: its sha256 is what it is, and a changed pack or
# nodeset is published under a new name. Entries are added by
# `sim geodata publish` and `sim nodeset publish`, which upload the files to
# the release below and append the entry here.
index: sim-mesh-examples
title: sim-mesh examples
description: |
  These examples will soon include some varied geographies and nodesets.
  Apart from demonstrating sim-mesh, they can also be used as reference
  environments to compare different mesh protocols and/or firmware versions.
release: sim-mesh/sim-mesh:examples
geodata:
  - name: berlin-centre
    title: Berlin centre, dense flat city, 10 m
    description: "About 15 × 12 km of central Berlin at 10 m: Berlin's own 1 m terrain, surface and LoD2 buildings, with OpenStreetMap, WorldCover and the 2022 census."
    url: https://github.com/sim-mesh/sim-mesh/releases/download/examples/berlin-centre.zip
    sha256: c1d4a7e38fa02e09540cd0dfd2aa3942604e1ddae0a29c47c56bd1c5e29ebd03
    bytes: 52762839
    bbox: [13.2688, 52.4511, 13.4898, 52.5605]
    licences: Copernicus GLO-30 DSM; Berlin DGM1 + bDOM (1 m); Berlin LoD2 3D building models; Zensus 2022 100 m population grid; ESA WorldCover 10 m (2021, v200); OpenStreetMap roads/rail; OpenStreetMap places/streets/postal codes
    tags: [city, flat, "10m"]
  - name: sonoma-valley
    title: Sonoma Valley, vineyards between two ranges, 30 m
    description: "About 22 × 28 km of Sonoma Valley, California at 30 m: USGS 3DEP terrain, NLCD land cover over WorldCover and WorldPop's 2025 population, with OpenStreetMap buildings, roads and places, and GLO-30 clutter."
    url: https://github.com/sim-mesh/sim-mesh/releases/download/examples/sonoma-valley.zip
    sha256: 394e778b6245905904fb7bd8958cac4201f6744af856c350afdd57762171c0b0
    bytes: 10434699
    bbox: [-122.6029, 38.1427, -122.3435, 38.3945]
    licences: Copernicus GLO-30 DSM; USGS 3DEP 1/3 arc-second terrain; WorldPop 2025 United States population; ESA WorldCover 2021 land cover; Annual NLCD 2025 land cover; OpenStreetMap roads/rail; OpenStreetMap places/streets/postal codes; OpenStreetMap buildings
    tags: [rural, hilly, "30m"]
nodesets: []
